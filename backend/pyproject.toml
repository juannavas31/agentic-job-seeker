[project]
name = "agentic-job-seeker-backend"
version = "0.1.0"
description = "FastAPI backend for resume-based job discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "httpx>=0.28.1",
    "beanie>=1.30.0",
    "pymongo>=4.9.0",
    "mongomock>=4.1.2",
    "testcontainers>=4.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
